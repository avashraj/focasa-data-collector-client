name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build app bundle
        run: uv run pyinstaller focasa.spec

      - name: Ad-hoc sign app
        run: codesign --force --deep --sign - dist/Focasa.app

      - name: Stage DMG contents
        run: |
          mkdir dmg_stage
          cp -r dist/Focasa.app dmg_stage/
          cat > "dmg_stage/Open Me First.txt" << 'EOF'
          HOW TO OPEN FOCASA
          ──────────────────────────────────────
          Because Focasa is not yet in the Mac App Store, macOS may
          show a warning the first time you open it.

          Fix (one-time only):
            1. Right-click Focasa.app
            2. Choose "Open"
            3. Click "Open" in the dialog that appears

          After this, Focasa opens normally every time.
          EOF

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Focasa" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Focasa.app" 175 190 \
            --hide-extension "Focasa.app" \
            --app-drop-link 425 190 \
            "Focasa.dmg" \
            dmg_stage/

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: Focasa.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        run: uv run pyinstaller focasa.spec

      - name: Upload EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Focasa.exe
