name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: focasa-data-collector-client

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build app bundle
        run: uv run pyinstaller focasa.spec

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Focasa" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Focasa.app" 175 190 \
            --hide-extension "Focasa.app" \
            --app-drop-link 425 190 \
            "Focasa.dmg" \
            "dist/Focasa.app"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: focasa-data-collector-client/Focasa.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: focasa-data-collector-client

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        run: uv run pyinstaller focasa.spec

      - name: Upload EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: focasa-data-collector-client/dist/Focasa.exe
